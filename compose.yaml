services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: refactoring_lab
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:11
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/refactoring_lab?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: app
      FLYWAY_PASSWORD: app
      FLYWAY_CONNECT_RETRIES: 20
